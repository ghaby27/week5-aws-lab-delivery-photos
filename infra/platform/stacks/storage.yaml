AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Storage stack (nested in the platform root) for the delivery photos lab.
  - Photos bucket: private (Block Public Access, owner-enforced, TLS only),
    versioned so a deleted photo can be restored, and replicated to a bucket in a
    second Region. Delete markers are not replicated, so the copy keeps every photo.
  - Replica bucket: created in the replica Region by a StackSet, because Git sync
    deploys in this Region only. Stored as Standard-IA (rarely read, cheaper).
  - CloudFront: the only reader of the photos bucket (Origin Access Control), and
    it serves only URLs signed by the app (trusted key group), which expire.
  - Signing key: generated by a small Lambda when the stack is created. The private
    key goes straight into Secrets Manager; only the public key leaves it.

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, test, prod]
    Default: dev
  OwnerName:
    Type: String
  TaskRoleName:
    Type: String
    Description: The photo app's task role (security stack); it gets the bucket policy below.
  ReplicaRegion:
    Type: String
    Default: eu-central-1
  NoncurrentVersionDays:
    Type: Number
    Default: 90
    Description: How long the photos bucket keeps deleted or replaced photos (the copy keeps them for good).
  PriceClass:
    Type: String
    Default: PriceClass_200
    AllowedValues: [PriceClass_100, PriceClass_200, PriceClass_All]
    Description: PriceClass_200 includes edge locations in Africa and the Middle East.

Resources:
  # ---------------------------------------------------------------------------
  # Replica bucket in the second Region (StackSet, one account, one Region)
  # ---------------------------------------------------------------------------
  ReplicaStackSet:
    Type: AWS::CloudFormation::StackSet
    Properties:
      StackSetName: !Sub "onward-${Environment}-photos-replica"
      Description: Replica of the delivery photos bucket, in the second Region.
      PermissionModel: SELF_MANAGED
      AdministrationRoleARN: !ImportValue { "Fn::Sub": "onward-${Environment}-photos-stackset-admin-role-arn" }
      ExecutionRoleName: !ImportValue { "Fn::Sub": "onward-${Environment}-photos-stackset-exec-role-name" }
      Parameters:
        - { ParameterKey: Environment, ParameterValue: !Ref Environment }
      Tags:
        - { Key: Project, Value: onward }
        - { Key: Owner, Value: !Ref OwnerName }
        - { Key: Environment, Value: !Ref Environment }
      StackInstancesGroup:
        - DeploymentTargets: { Accounts: [!Ref AWS::AccountId] }
          Regions: [!Ref ReplicaRegion]
      TemplateBody: |
        AWSTemplateFormatVersion: "2010-09-09"
        Description: Replica of the Onward delivery photos bucket. Receives copies only; nobody reads it directly.
        Parameters:
          Environment:
            Type: String
        Resources:
          ReplicaBucket:
            Type: AWS::S3::Bucket
            Properties:
              BucketName: !Sub "onward-${Environment}-photos-replica-${AWS::AccountId}"
              VersioningConfiguration: { Status: Enabled }   # required to receive replicas
              BucketEncryption:
                ServerSideEncryptionConfiguration:
                  - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
              PublicAccessBlockConfiguration:
                BlockPublicAcls: true
                BlockPublicPolicy: true
                IgnorePublicAcls: true
                RestrictPublicBuckets: true
              OwnershipControls:
                Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
          ReplicaBucketPolicy:
            Type: AWS::S3::BucketPolicy
            Properties:
              Bucket: !Ref ReplicaBucket
              PolicyDocument:
                Version: "2012-10-17"
                Statement:
                  - Sid: TlsOnly
                    Effect: Deny
                    Principal: "*"
                    Action: s3:*
                    Resource: [!GetAtt ReplicaBucket.Arn, !Sub "${ReplicaBucket.Arn}/*"]
                    Condition: { Bool: { aws:SecureTransport: "false" } }
        Outputs:
          ReplicaBucketArn:
            Value: !GetAtt ReplicaBucket.Arn

  # ---------------------------------------------------------------------------
  # Photos bucket (primary Region)
  # ---------------------------------------------------------------------------
  ReplicationPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "onward-${Environment}-photos-replication"
      Description: Copy new photo versions from the photos bucket to the replica bucket.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ReadSourceConfig
            Effect: Allow
            Action: [s3:GetReplicationConfiguration, s3:ListBucket]
            Resource: !Sub "arn:${AWS::Partition}:s3:::onward-${Environment}-photos-${AWS::AccountId}"
          - Sid: ReadSourceVersions
            Effect: Allow
            Action: [s3:GetObjectVersionForReplication, s3:GetObjectVersionAcl, s3:GetObjectVersionTagging]
            Resource: !Sub "arn:${AWS::Partition}:s3:::onward-${Environment}-photos-${AWS::AccountId}/*"
          - Sid: WriteReplica
            Effect: Allow
            Action: [s3:ReplicateObject, s3:ReplicateTags]   # no s3:ReplicateDelete
            Resource: !Sub "arn:${AWS::Partition}:s3:::onward-${Environment}-photos-replica-${AWS::AccountId}/*"

  ReplicationRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "onward-${Environment}-photos-replication"
      Description: Assumed by S3 to replicate delivery photos to the second Region.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: s3.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns: [!Ref ReplicationPolicy]

  PhotosBucket:
    Type: AWS::S3::Bucket
    DependsOn: ReplicaStackSet   # replication needs the destination bucket to exist
    Properties:
      BucketName: !Sub "onward-${Environment}-photos-${AWS::AccountId}"
      VersioningConfiguration: { Status: Enabled }
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      LifecycleConfiguration:
        Rules:
          - Id: keep-deleted-photos-for-a-while
            Status: Enabled
            NoncurrentVersionExpiration: { NoncurrentDays: !Ref NoncurrentVersionDays }
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 7 }
      ReplicationConfiguration:
        Role: !GetAtt ReplicationRole.Arn
        Rules:
          - Id: copy-every-photo-to-the-second-region
            Status: Enabled
            Priority: 1
            Filter: { Prefix: "" }
            DeleteMarkerReplication: { Status: Disabled }   # a delete here never deletes the copy
            Destination:
              Bucket: !Sub "arn:${AWS::Partition}:s3:::onward-${Environment}-photos-replica-${AWS::AccountId}"
              StorageClass: STANDARD_IA

  PhotosBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref PhotosBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: CloudFrontReadsPhotos
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub "${PhotosBucket.Arn}/photos/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}"
          - Sid: TlsOnly
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource: [!GetAtt PhotosBucket.Arn, !Sub "${PhotosBucket.Arn}/*"]
            Condition: { Bool: { aws:SecureTransport: "false" } }

  # The app: upload, soft-delete (adds a delete marker) and restore (copies an old
  # version back). It cannot remove versions, so it can never lose a photo for good.
  TaskPhotosPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "onward-${Environment}-photos-task-bucket"
      Description: Read and write delivery photos; no permanent deletes.
      Roles: [!Ref TaskRoleName]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ListVersions
            Effect: Allow
            Action: [s3:ListBucket, s3:ListBucketVersions]
            Resource: !GetAtt PhotosBucket.Arn
          - Sid: Photos
            Effect: Allow
            Action: [s3:PutObject, s3:GetObject, s3:GetObjectVersion, s3:DeleteObject]
            Resource: !Sub "${PhotosBucket.Arn}/photos/*"

  # ---------------------------------------------------------------------------
  # Signing key for CloudFront signed URLs
  # ---------------------------------------------------------------------------
  SigningKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "onward-${Environment}-photos-cloudfront-key"
      Description: Private key the photo app signs CloudFront URLs with. Written by the key generator below.
      GenerateSecretString: { PasswordLength: 32 }   # placeholder until the generator writes the key

  KeyGeneratorPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "onward-${Environment}-photos-keygen"
      Description: Write the CloudFront signing key secret, nothing else.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: secretsmanager:PutSecretValue
            Resource: !Ref SigningKeySecret

  KeyGeneratorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "onward-${Environment}-photos-keygen"
      Description: Assumed by the Lambda that creates the CloudFront signing key.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
        - !Ref KeyGeneratorPolicy

  KeyGeneratorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/onward/${Environment}/photos/keygen"
      RetentionInDays: 7

  KeyGenerator:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "onward-${Environment}-photos-keygen"
      Description: Creates an RSA key pair; private key to Secrets Manager, public key back to CloudFormation.
      Runtime: nodejs22.x
      Handler: index.handler
      Timeout: 30
      Role: !GetAtt KeyGeneratorRole.Arn
      LoggingConfig: { LogGroup: !Ref KeyGeneratorLogGroup }
      Code:
        ZipFile: |
          // CloudFormation custom resource. Node's built-in crypto makes the key pair,
          // so no layer or package is needed.
          const crypto = require("crypto");
          const https = require("https");
          const { SecretsManagerClient, PutSecretValueCommand } = require("@aws-sdk/client-secrets-manager");
          const sm = new SecretsManagerClient({});

          function respond(event, context, status, data, reason) {
            const body = JSON.stringify({
              Status: status,
              Reason: reason || "See " + context.logStreamName,
              PhysicalResourceId: (data && data.KeyId) || event.PhysicalResourceId || context.logStreamName,
              StackId: event.StackId, RequestId: event.RequestId, LogicalResourceId: event.LogicalResourceId,
              Data: data || {},
            });
            const url = new URL(event.ResponseURL);
            return new Promise((resolve) => {
              const req = https.request({ hostname: url.hostname, path: url.pathname + url.search, method: "PUT",
                headers: { "content-type": "", "content-length": Buffer.byteLength(body) } },
                (res) => { res.on("data", () => {}); res.on("end", resolve); });
              req.on("error", (e) => { console.log(e); resolve(); });
              req.end(body);
            });
          }

          exports.handler = async (event, context) => {
            try {
              if (event.RequestType === "Delete") return await respond(event, context, "SUCCESS");
              const { publicKey, privateKey } = crypto.generateKeyPairSync("rsa", {
                modulusLength: 2048,
                publicKeyEncoding: { type: "spki", format: "pem" },
                privateKeyEncoding: { type: "pkcs8", format: "pem" },
              });
              await sm.send(new PutSecretValueCommand({ SecretId: event.ResourceProperties.SecretArn, SecretString: privateKey }));
              const keyId = "onward-" + crypto.createHash("sha256").update(publicKey).digest("hex").slice(0, 16);
              await respond(event, context, "SUCCESS", { PublicKey: publicKey, KeyId: keyId });
            } catch (e) {
              console.log(e);
              await respond(event, context, "FAILED", null, String(e));
            }
          };

  SigningKeyPair:
    Type: Custom::CloudFrontKeyPair
    Properties:
      ServiceToken: !GetAtt KeyGenerator.Arn
      SecretArn: !Ref SigningKeySecret

  SigningPublicKey:
    Type: AWS::CloudFront::PublicKey
    Properties:
      PublicKeyConfig:
        Name: !Sub "onward-${Environment}-photos-signing"
        Comment: Verifies the photo app's signed URLs.
        CallerReference: !GetAtt SigningKeyPair.KeyId
        EncodedKey: !GetAtt SigningKeyPair.PublicKey

  SigningKeyGroup:
    Type: AWS::CloudFront::KeyGroup
    Properties:
      KeyGroupConfig:
        Name: !Sub "onward-${Environment}-photos-signers"
        Comment: The photo app. Only URLs signed with its key are served.
        Items: [!Ref SigningPublicKey]

  # ---------------------------------------------------------------------------
  # CloudFront
  # ---------------------------------------------------------------------------
  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "onward-${Environment}-photos-oac"
        Description: CloudFront signs its requests to the photos bucket.
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "onward-${Environment}-photos-cdn"
        PriceClass: !Ref PriceClass
        HttpVersion: http2and3
        Origins:
          - Id: photos
            DomainName: !GetAtt PhotosBucket.RegionalDomainName
            S3OriginConfig: { OriginAccessIdentity: "" }
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
        DefaultCacheBehavior:
          TargetOriginId: photos
          ViewerProtocolPolicy: https-only
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          # Managed CachingOptimized: long TTLs, query strings (the URL signature) not in
          # the cache key, so every signed link to a photo shares one cached copy.
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          Compress: false   # JPEG/PNG/WebP are already compressed
          TrustedKeyGroups: [!Ref SigningKeyGroup]
      Tags:
        - { Key: Name, Value: !Sub "onward-${Environment}-photos-cdn" }

Outputs:
  PhotosBucketName:
    Value: !Ref PhotosBucket
  ReplicaBucketName:
    Value: !Sub "onward-${Environment}-photos-replica-${AWS::AccountId}"
  CdnDomain:
    Value: !GetAtt Distribution.DomainName
  SigningKeyId:
    Description: CloudFront public key ID; the Key-Pair-Id of every signed URL.
    Value: !Ref SigningPublicKey
  SigningKeySecretArn:
    Value: !Ref SigningKeySecret
